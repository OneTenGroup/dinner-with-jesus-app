workflows:
  dwj-ios-release:
    name: DWJ iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - apple_credentials_bundle
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        XCODE_CONFIGURATION: "Release"
        TEAM_ID: "S7MNGR6MUX"
        BUNDLE_ID: ai.flippingtables.app
      node: latest
      xcode: latest

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build web app (production bundle, no remote server.url)
        script: |
          npm run build

      - name: Capacitor sync iOS
        script: |
          npx cap sync ios

      - name: Load validated Apple credentials
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os

          encoded = os.environ["CODEMAGIC_APPLE_CREDENTIALS_B64"]
          credentials = json.loads(base64.b64decode(encoded).decode("utf-8"))

          required = [
              "APP_STORE_CONNECT_PRIVATE_KEY",
              "APP_STORE_CONNECT_KEY_IDENTIFIER",
              "APP_STORE_CONNECT_ISSUER_ID",
              "CERTIFICATE_PRIVATE_KEY",
          ]

          missing = [key for key in required if not credentials.get(key)]
          if missing:
              raise RuntimeError("Missing required credential fields")

          cm_env = os.environ["CM_ENV"]
          with open(cm_env, "a", encoding="utf-8") as output:
              for key in required:
                  value = credentials[key]
                  if "\n" in value:
                      delimiter = f"__CM_{key}_END__"
                      output.write(f"{key}<<{delimiter}\n")
                      output.write(value.rstrip("\n") + "\n")
                      output.write(delimiter + "\n")
                  else:
                      output.write(f"{key}={value}\n")
          PY

      - name: Initialize keychain
        script: keychain initialize

      - name: Fetch or create Apple signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add signing certificate to keychain
        script: keychain add-certificates

      - name: Apply provisioning profile
        script: xcode-project use-profiles

      - name: Build signed ipa for App Store distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config "$XCODE_CONFIGURATION"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.dSYM.zip
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
