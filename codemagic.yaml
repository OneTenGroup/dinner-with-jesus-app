workflows:
  dwj-ios-release:
    name: DWJ iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - apple_credentials_bundle
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        XCODE_CONFIGURATION: "Release"
        TEAM_ID: "S7MNGR6MUX"
        BUNDLE_ID: ai.flippingtables.app
      node: latest
      xcode: latest

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build web app (production bundle, no remote server.url)
        script: |
          npm run build

      - name: Capacitor sync iOS
        script: |
          npx cap sync ios

      - name: Load validated Apple credentials
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os

          encoded = os.environ["CODEMAGIC_APPLE_CREDENTIALS_B64"]
          credentials = json.loads(base64.b64decode(encoded).decode("utf-8"))

          required = [
              "APP_STORE_CONNECT_PRIVATE_KEY",
              "APP_STORE_CONNECT_KEY_IDENTIFIER",
              "APP_STORE_CONNECT_ISSUER_ID",
              "CERTIFICATE_PRIVATE_KEY",
          ]

          missing = [key for key in required if not credentials.get(key)]
          if missing:
              raise RuntimeError("Missing required credential fields")

          cm_env = os.environ["CM_ENV"]
          with open(cm_env, "a", encoding="utf-8") as output:
              for key in required:
                  value = credentials[key]
                  if "\n" in value:
                      delimiter = f"__CM_{key}_END__"
                      output.write(f"{key}<<{delimiter}\n")
                      output.write(value.rstrip("\n") + "\n")
                      output.write(delimiter + "\n")
                  else:
                      output.write(f"{key}={value}\n")
          PY

      # Build-number handling: CURRENT_PROJECT_VERSION in
      # ios/App/App.xcodeproj/project.pbxproj is currently set and bumped
      # manually (2026-09-08: 1 -> 2, after an
      # ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE rejection from App Store
      # Connect for reusing build number 1). The step below safely
      # automates this going forward, but is OPT-IN and inert until
      # APP_STORE_APPLE_ID is configured -- it was left unset here
      # deliberately rather than guessed, since a wrong value would fail
      # the App Store Connect API call, not just skip it.
      #
      # To activate: in Codemagic, add APP_STORE_APPLE_ID as an
      # environment variable (ideally in the apple_credentials_bundle
      # group above) set to this app's numeric Apple ID -- found in App
      # Store Connect under the app's General > App Information page
      # (labeled "Apple ID", a 10-digit number, NOT the bundle ID). No
      # further code change is needed once that's set; this step will
      # start running automatically on the next build.
      - name: Increment build number from App Store Connect (opt-in, see comment above)
        script: |
          set -euo pipefail
          if [ -z "${APP_STORE_APPLE_ID:-}" ]; then
            echo "APP_STORE_APPLE_ID not set -- skipping automatic build-number increment."
            echo "CURRENT_PROJECT_VERSION stays at whatever is committed in project.pbxproj."
          else
            LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" --platform IOS --all-versions)
            NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
            echo "Latest build number known to App Store Connect/TestFlight: $LATEST_BUILD_NUMBER -- setting CURRENT_PROJECT_VERSION to $NEW_BUILD_NUMBER"
            cd ios/App
            agvtool new-version -all "$NEW_BUILD_NUMBER"
          fi

      - name: Initialize keychain
        script: keychain initialize

      - name: Fetch or create Apple signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add signing certificate to keychain
        script: keychain add-certificates

      - name: Apply provisioning profile
        script: xcode-project use-profiles

      - name: Build signed ipa for App Store distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config "$XCODE_CONFIGURATION"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.dSYM.zip
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
